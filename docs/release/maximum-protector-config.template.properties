# Vendor-neutral skeleton for the private maximum-release adapter config.
# This is a template, not a runnable DashO/Zelix configuration. The licensed
# adapter must translate it into the selected vendor's documented format.
# Never commit license material, signing keys, or a production seed here.

schema=1
profile=maximum-release
tierInventory=docs/release/protection-tier-inventory.md
keepRuleInventory=docs/release/protection-keep-rules.md
acceptanceProcedure=docs/release/protected-acceptance.md

# Tier 0 contracts remain stable or are explicitly adapted.
tier0.mode=preserve-and-test
# Tier 1 is eligible for ordinary proprietary transformation.
tier1.mode=shrink-rename-metadata-string-protection
# Tier 2 receives stronger control-flow/constant protection after profiling.
tier2.mode=selective-control-flow-and-constant-protection
# Tier 3 is method-scoped and must include genuine virtualization evidence.
tier3.mode=method-scoped-virtualization

ring.controlFlow=required
ring.virtualization=required
ring.strings=required
ring.analysisEnvironment=required
ring.protectedPayload=required
ring.antiDebug=required

# Signed distribution integrity is owned by the Gradle/bootstrap release
# pipeline after adapter output. It is not a vendor result property and must
# be recorded as verified only after the detached Ed25519 signature passes.

# Legitimate VM/CI execution must remain allowed. Analysis-risk behavior is
# detect/refuse for the protected operation, never destructive retaliation.
analysisEnvironment.legitimateVm=allow
analysisEnvironment.policy=multi-signal-safe-refuse
antiDebug.policy=detect-log-refuse-sensitive-operation
protectedPayload.mode=vendor-protected-loader

# The adapter supplies these values at invocation time from private release
# authority; placeholder values must fail closed in the Gradle task.
release.id=<injected-release-id>
release.seed=<injected-private-seed>
release.sourceCommit=<injected-source-commit>
release.protectorVersion=<pinned-vendor-version>
release.privateDirectory=<injected-private-directory>
