# Gradle Build Speed & Portable Performance Settings
# This workstation has 32 GB RAM. Keep enough headroom for the IDE, test JVMs,
# and native toolchains while allowing large Java compilation tasks to grow.
org.gradle.jvmargs=-Xmx24g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=12
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
