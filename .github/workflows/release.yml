name: release-artifacts

# A push or a pull request is checked and its installers are built and kept with the run, under
# Artifacts on its Actions page. No release is published and no tag is created. A release is made
# by hand, by running this workflow from the Actions page or by pushing a v* tag.
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub Release tag; blank creates a manual prerelease
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  java:
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -Djdk.lang.Process.launchMechanism=FORK
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      # gradle.properties sizes the worker pool for a 16-core workstation. On a hosted runner that
      # starts three times more test tasks than there are cores, and tests that wait on a child JVM
      # or a liveness window then miss their deadlines. Run as many workers as the runner has cores.
      - run: ./gradlew.bat check --dependency-verification=strict "--max-workers=$env:NUMBER_OF_PROCESSORS"
        if: runner.os == 'Windows'
      - run: ./gradlew check --dependency-verification=strict --max-workers="$(getconf _NPROCESSORS_ONLN)"
        if: runner.os != 'Windows'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  prepare-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || format('manual-{0}', github.run_number) }}
          AUTO_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "release_tag may contain only letters, numbers, dots, underscores, and hyphens" >&2
              exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              exit 0
          fi
          release_args=("${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "${RELEASE_TAG}" --generate-notes)
          if [[ "${AUTO_PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" --repo "${{ github.repository }}"

  bundles:
    needs: [ java, prepare-release ]
    if: always() && needs.java.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2025, file: synesis-windows-x64.exe }
          - { platform: windows-arm64, runner: windows-11-arm, file: synesis-windows-arm64.exe }
          - { platform: linux-x64, runner: ubuntu-24.04, file: synesis-linux-x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, file: synesis-linux-arm64 }
          - { platform: macos-x64, runner: macos-15-intel, file: synesis-macos-x64 }
          - { platform: macos-arm64, runner: macos-15, file: synesis-macos-arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      # A secret cannot be read in `if:`; this says only whether it is set.
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      # A v* tag builds that version, so the archives, the release manifest and the OS packages agree
      # on it. Every other run keeps the development number.
      - name: Choose the bundle version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.1.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "BUNDLE_VERSION=${version}" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: bootstrap/go.mod
      - run: ./gradlew.bat :cli:bundleSmokeTest -PbundlePlatform=${{ matrix.platform }} "-PsynesisVersion=$env:BUNDLE_VERSION" --dependency-verification=strict --no-configuration-cache
        if: runner.os == 'Windows'
      - run: ./gradlew :cli:bundleSmokeTest -PbundlePlatform=${{ matrix.platform }} "-PsynesisVersion=${BUNDLE_VERSION}" --dependency-verification=strict --no-configuration-cache
        if: runner.os != 'Windows'
        env:
          JAVA_TOOL_OPTIONS: -Djdk.lang.Process.launchMechanism=FORK
      # Authenticode through SignPath Foundation (docs/release/signing.md), on a release run once the owner has set the
      # SIGNPATH_API_TOKEN secret and the SIGNPATH_* variables; until then the installer ships unsigned, as before.
      # SignPath fetches the file from this run's artifacts and checks it was built here, on a GitHub-hosted runner.
      - name: Keep the unsigned installer for SignPath
        id: unsigned-installer
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && runner.os == 'Windows' && env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: cli/build/distributions/${{ matrix.file }}
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer (SignPath)
        if: steps.unsigned-installer.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: cli/build/signed
      - name: Use the signed installer
        if: steps.unsigned-installer.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem cli/build/signed -Recurse -Filter '${{ matrix.file }}' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no ${{ matrix.file }}' }
          if ((Get-AuthenticodeSignature $signed.FullName).Status -ne 'Valid') { throw 'the returned installer has no valid signature' }
          Copy-Item $signed.FullName 'cli/build/distributions/${{ matrix.file }}' -Force
      # Keyless: GitHub signs a statement of which repository, commit and workflow built each release file, with this
      # run's own identity (Sigstore), so no key exists to keep or lose. Anyone checks a downloaded file with
      # `gh attestation verify <file> --repo <owner>/<repo>`. Not code signing: Windows and macOS still warn.
      - name: Attest where the release files were built
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            cli/build/distributions/${{ matrix.file }}
            cli/build/distributions/synesis-${{ env.BUNDLE_VERSION }}-${{ matrix.platform }}.*
      # Actions wraps an artifact download in a ZIP. A release publishes the raw file instead.
      - name: Keep the installer with this run
        if: ${{ !(github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: cli/build/distributions/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish raw runnable release asset (Windows)
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || format('manual-{0}', github.run_number) }}
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 12; $attempt++) {
              gh release upload "$env:RELEASE_TAG" "cli/build/distributions/${{ matrix.file }}" --repo "${{ github.repository }}" --clobber
              if ($LASTEXITCODE -eq 0) {
                  exit 0
              }
              if ($attempt -lt 12) {
                  Start-Sleep -Seconds 5
              }
          }
          exit $LASTEXITCODE
      - name: Publish raw runnable release asset (Unix)
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || format('manual-{0}', github.run_number) }}
        shell: bash
        run: |
          for attempt in {1..12}; do
              if gh release upload "${RELEASE_TAG}" "cli/build/distributions/${{ matrix.file }}" --repo "${{ github.repository }}" --clobber; then
                  exit 0
              fi
              if [[ "${attempt}" -lt 12 ]]; then
                  sleep 5
              fi
          done
          exit 1
      # The release manifest names these archives, and the OS packages (Homebrew, apt) install them.
      - name: Publish platform archive
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || format('manual-{0}', github.run_number) }}
          ARCHIVE_EXTENSION: ${{ startsWith(matrix.platform, 'windows') && 'zip' || 'tar.gz' }}
        shell: bash
        run: |
          gh release upload "${RELEASE_TAG}" "cli/build/distributions/synesis-${BUNDLE_VERSION}-${{ matrix.platform }}.${ARCHIVE_EXTENSION}" --repo "${{ github.repository }}" --clobber

  # Only a v* tag makes packages. The manifest is signed when the signing secret exists; without it
  # the job says so and publishes no manifest, because an unsigned one is refused by every installer.
  # docs/installation/packages.md lists what the owner provides.
  package-release:
    needs: bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      SYNESIS_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.SYNESIS_MANIFEST_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: bootstrap/go.mod
      - name: Render the manifest and the package definitions
        run: |
          bash scripts/release-packages/render-packages-test.sh
          gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" --dir assets --pattern 'synesis-*'
          bash scripts/release-packages/render-packages.sh "${RELEASE_TAG#v}" "${RELEASE_TAG}" "${{ github.repository }}" assets out
      - name: Sign the manifest
        id: sign
        run: |
          if [[ -z "${SYNESIS_MANIFEST_PRIVATE_KEY_B64}" ]]; then
              echo "::notice::SYNESIS_MANIFEST_PRIVATE_KEY_B64 is not set: the release manifest is not signed and is not published."
              echo "Manifest not signed: no SYNESIS_MANIFEST_PRIVATE_KEY_B64 secret. The package definitions are in this run's artifacts." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
          fi
          pinned="$(grep -o 'manifestPublicKeyHex = "[0-9a-f]\{64\}"' bootstrap/main.go | grep -o '[0-9a-f]\{64\}' || true)"
          if [[ -z "${pinned}" ]]; then
              echo "::error::The signing secret is set but bootstrap/main.go still pins the placeholder key; a manifest signed now could not be verified by any installer."
              exit 1
          fi
          (cd bootstrap && go run ./cmd/sign-manifest --manifest "${GITHUB_WORKSPACE}/out/manifest.json" --signature "${GITHUB_WORKSPACE}/out/manifest.json.sig" --public-key-hex "${pinned}")
          echo "signed=true" >> "${GITHUB_OUTPUT}"
          echo "Manifest signed with the key pinned in bootstrap/main.go." >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish the signed manifest
        if: steps.sign.outputs.signed == 'true'
        run: gh release upload "${RELEASE_TAG}" out/manifest.json out/manifest.json.sig --repo "${{ github.repository }}" --clobber
      - name: Keep the package definitions with this run
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/
          if-no-files-found: error
          retention-days: 30
