name: release-artifacts

on:
    push:
        branches: [ '**' ]
        tags: [ 'v*' ]
    pull_request:

permissions:
    contents: read
    actions: write

jobs:
    java:
        runs-on: ubuntu-24.04
        env:
            JAVA_TOOL_OPTIONS: -Djdk.lang.Process.launchMechanism=FORK
        steps:
            -   uses: actions/checkout@v5
            -   uses: actions/setup-java@v5
                with:
                    distribution: microsoft
                    java-version: '25'
            -   uses: gradle/actions/setup-gradle@v6
                with:
                    add-job-summary: never
            -   run: ./gradlew.bat check --dependency-verification=strict
                if: runner.os == 'Windows'
            -   run: ./gradlew check --dependency-verification=strict
                if: runner.os != 'Windows'

    bundles:
        needs: java
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { platform: windows-x64, runner: windows-2025, archive: zip }
                    - { platform: windows-arm64, runner: windows-11-arm, archive: zip }
                    - { platform: linux-x64, runner: ubuntu-24.04, archive: tar.gz }
                    - { platform: linux-arm64, runner: ubuntu-24.04-arm, archive: tar.gz }
                    - { platform: macos-x64, runner: macos-15-intel, archive: tar.gz }
                    - { platform: macos-arm64, runner: macos-15, archive: tar.gz }
        runs-on: ${{ matrix.runner }}
        steps:
            -   uses: actions/checkout@v5
            -   uses: actions/setup-java@v5
                with:
                    distribution: microsoft
                    java-version: '25'
            -   uses: gradle/actions/setup-gradle@v6
                with:
                    add-job-summary: never
            -   uses: actions/setup-go@v6
                with:
                    go-version: '1.26.5'
                    cache-dependency-path: bootstrap/go.mod
            -   run: ./gradlew.bat :cli:bundleSmokeTest -PbundlePlatform=${{ matrix.platform }} "-PsynesisVersion=0.1.0-dev.${{ github.run_number }}" --dependency-verification=strict --no-configuration-cache
                if: runner.os == 'Windows'
            -   run: ./gradlew :cli:bundleSmokeTest -PbundlePlatform=${{ matrix.platform }} "-PsynesisVersion=0.1.0-dev.${{ github.run_number }}" --dependency-verification=strict --no-configuration-cache
                if: runner.os != 'Windows'
                env:
                    JAVA_TOOL_OPTIONS: -Djdk.lang.Process.launchMechanism=FORK
            -   uses: actions/upload-artifact@v6
                with:
                    name: synesis-${{ matrix.platform }}
                    path: cli/build/distributions/synesis-0.1.0-dev.${{ github.run_number }}-${{ matrix.platform }}.${{ matrix.archive }}
                    retention-days: 30
